[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pca-demo"
version = "0.1.0"
description = "PCA Implementation Demo"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
